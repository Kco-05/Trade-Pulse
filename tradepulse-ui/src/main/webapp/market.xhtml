<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/layout.xhtml">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{userSession.refreshBalance}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="title">Market</ui:define>

    <ui:define name="content">
        <section class="tp-page" aria-labelledby="marketHeading">
            <h1 id="marketHeading" class="tp-heading">Market</h1>
            <p class="tp-muted">Live prices refresh every 5 seconds.</p>

            <h:form id="marketForm" styleClass="tp-page__body">
                <p:outputPanel id="stockPanel" layout="block">
                    <p:dataTable id="stockTable" value="#{marketBean.stocks}" var="stock"
                                 emptyMessage="No stocks available." styleClass="tp-table"
                                 rowKey="#{stock.tickerSymbol}">
                        <p:column headerText="Ticker">
                            <h:outputText value="#{stock.tickerSymbol}"/>
                        </p:column>
                        <p:column headerText="Company">
                            <h:outputText value="#{stock.companyName}"/>
                        </p:column>
                        <p:column headerText="Price" styleClass="tp-col-numeric">
                            <h:outputText value="#{stock.currentPrice}">
                                <f:convertNumber type="currency" currencyCode="USD" locale="en_US"/>
                            </h:outputText>
                        </p:column>
                        <p:column headerText="Actions" styleClass="tp-col-actions">
                            <p:commandButton value="Buy" styleClass="tp-button-quiet"
                                             action="#{tradeBean.openBuy(stock)}"
                                             update=":marketForm:tradeDialog"
                                             oncomplete="PF('marketPoll').stop(); PF('tradeDialog').show()"
                                             process="@this"/>
                            <p:commandButton value="Sell" styleClass="tp-button-quiet"
                                             action="#{tradeBean.openSell(stock)}"
                                             update=":marketForm:tradeDialog"
                                             oncomplete="PF('marketPoll').stop(); PF('tradeDialog').show()"
                                             process="@this"/>
                        </p:column>
                    </p:dataTable>
                </p:outputPanel>

                <p:poll widgetVar="marketPoll" interval="5"
                        listener="#{marketBean.refresh}" update="stockPanel"/>

                <p:dialog id="tradeDialog" widgetVar="tradeDialog"
                          header="#{tradeBean.dialogHeader}"
                          visible="#{tradeBean.dialogVisible}"
                          modal="true" responsive="true" closable="true"
                          closeOnEscape="true" draggable="false" resizable="false"
                          styleClass="tp-dialog"
                          onHide="PF('marketPoll').start()">
                    <div class="tp-trade-dialog">
                        <p:messages id="tradeMessages" globalOnly="true" showDetail="false"
                                    closable="true" styleClass="tp-trade-messages"/>
                        <p class="tp-muted">
                            <h:outputText value="#{tradeBean.companyName}"/>
                            —
                            <h:outputText value="#{tradeBean.currentPrice}">
                                <f:convertNumber type="currency" currencyCode="USD" locale="en_US"/>
                            </h:outputText>
                        </p>
                        <div class="tp-field">
                            <p:outputLabel for="quantity" value="Quantity"/>
                            <p:spinner id="quantity" value="#{tradeBean.quantity}"
                                       min="1" max="10000" rotate="false"
                                       decimalPlaces="0" thousandSeparator=""/>
                            <p:message id="quantityMsg" for="quantity" display="text"/>
                        </div>
                    </div>
                    <f:facet name="footer">
                        <p:commandButton value="Cancel" styleClass="tp-button-quiet"
                                         action="#{tradeBean.cancel}"
                                         update="tradeDialog" process="@this"
                                         oncomplete="PF('tradeDialog').hide()"/>
                        <p:commandButton value="#{tradeBean.buyMode ? 'Confirm buy' : 'Confirm sell'}"
                                         styleClass="tp-button-primary tp-button-dialog"
                                         action="#{tradeBean.confirm}"
                                         update=":growl :headerForm:balance tradeMessages quantityMsg"
                                         process="@this :marketForm:quantity"
                                         oncomplete="if (!#{tradeBean.dialogVisible}) { PF('tradeDialog').hide(); }"/>
                    </f:facet>
                </p:dialog>
            </h:form>
        </section>
    </ui:define>
</ui:composition>
